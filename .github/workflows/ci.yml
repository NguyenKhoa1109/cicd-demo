name: CI/CD & Reporting Pipeline

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  checks: write

jobs:
  build-test-report-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Java 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Run Unit Tests
      run: mvn clean test

    - name: Publish Test Report
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Unit Test Results
        path: target/surefire-reports/TEST-*.xml
        reporter: java-junit

    # --- 2 BƯỚC DEPLOY MỚI THÊM VÀO DƯỚI ĐÂY ---
    - name: Build (Đóng gói project thành file JAR)
      run: mvn package -DskipTests

    - name: Deploy (Tải file JAR lên GitHub Artifacts)
      uses: actions/upload-artifact@v4
      with:
        name: math-util-release
        path: target/*.jar