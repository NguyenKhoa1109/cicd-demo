name: CI/CD & Reporting Pipeline

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  checks: write

jobs:
  build-test-report:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Java 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Run Unit Tests
      run: mvn clean test

    - name: Publish Test Report
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Unit Test Results
        path: target/surefire-reports/TEST-*.xml
        reporter: java-junit